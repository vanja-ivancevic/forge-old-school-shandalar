<body>

<script src="shared.js"></script>

<!-- MAIN CONTENT -->

<center>

<img src="gifs/fire_bar.gif" alt="~*~*~*~" class="firebar" width="100%" style="max-width:664px">

<font size="5" color="#FFFF00" class="section-header">
<b>&#9733; Deck Gallery &#9733;</b>
</font>
<br>
<font size="2" color="#AAAACC">Browse and vote on community Adventure Mode decks!</font>
<br><br>

<!-- SUBMIT BUTTON -->
<a href="submit-deck.html">
<button style="background:#220044;color:#FFFF00;border:2px outset #663399;padding:8px 24px;font-size:14px;cursor:pointer;font-family:'Comic Sans MS',sans-serif">
&#9733; Submit Your Deck &#9733;
</button>
</a>

<img src="gifs/swords_divider.gif" alt="~*~*~*~" class="firebar" style="max-width:332px;width:80%">
<br><br>

<!-- FILTERS -->
<table width="90%" border="2" bordercolor="#333366" cellpadding="10" cellspacing="0" bgcolor="#0a0a2e" style="max-width:600px">
<tr><td>

<font size="2" color="#CCCCFF"><b>Filter &amp; Sort:</b></font>
<br><br>

<!-- Color Identity Filter -->
<font size="2" color="#AAAACC">Color:</font>&nbsp;
<span id="color-filters"></span>
&nbsp;&nbsp;

<!-- Archetype Dropdown -->
<font size="2" color="#AAAACC">Archetype:</font>&nbsp;
<select id="filter-tag" style="background:#0a001a;color:#AACCFF;border:1px inset #663399;font-size:12px">
<option value="">All</option>
</select>
&nbsp;&nbsp;

<!-- Badge Dropdown -->
<font size="2" color="#AAAACC">Badge:</font>&nbsp;
<select id="filter-badge" style="background:#0a001a;color:#AACCFF;border:1px inset #663399;font-size:12px">
<option value="">All</option>
</select>
&nbsp;&nbsp;

<!-- Sort -->
<font size="2" color="#AAAACC">Sort:</font>&nbsp;
<select id="sort-by" style="background:#0a001a;color:#AACCFF;border:1px inset #663399;font-size:12px">
<option value="newest">Newest</option>
<option value="votes">Most Voted</option>
<option value="alpha">Alphabetical</option>
</select>

<br><br>
<button id="btn-apply-filters" style="background:#220044;color:#00CCFF;border:2px outset #663399;padding:4px 16px;font-size:12px;cursor:pointer">
Apply Filters
</button>
<button id="btn-clear-filters" style="background:#1a0a2e;color:#888;border:2px outset #333366;padding:4px 16px;font-size:12px;cursor:pointer;margin-left:8px">
Clear
</button>

</td></tr>
</table>

<br>

<!-- DECK GRID -->
<div id="deck-grid" style="max-width:650px;width:90%"></div>

<!-- LOADING -->
<div id="loading-indicator" style="display:none">
<br>
<font color="#FFFF00">Loading decks...</font>

</div>

<!-- NO RESULTS -->
<div id="no-results" style="display:none">
<br>
<font color="#888888">No decks found. Be the first to <a href="submit-deck.html">submit one</a>!</font>
<br><br>
</div>

<!-- PAGINATION -->
<div id="pagination" style="margin:15px 0">
<button id="btn-prev" style="display:none;background:#220044;color:#AACCFF;border:2px outset #663399;padding:4px 14px;font-size:12px;cursor:pointer">
&laquo; Prev
</button>
<span id="page-info" style="margin:0 10px"></span>
<button id="btn-next" style="display:none;background:#220044;color:#AACCFF;border:2px outset #663399;padding:4px 14px;font-size:12px;cursor:pointer">
Next &raquo;
</button>
</div>

<br>
<img src="gifs/fire_bar.gif" alt="~*~*~*~" class="firebar" width="100%" style="max-width:664px">
<br><br>

<font size="2" color="#666688">Last updated: March 2026</font>

<br><br>
</center>
</td>

</tr>
</table>

<script type="module">
import { fetchDecks, fetchTagRegistry, getVotedDecks, toggleVote, ensureAuth,
         renderColorPipsDom, renderBadgeDom, renderTagDom, formatDate, buildColorCode
} from './deck-gallery.js';

var currentPage = 1;
var lastDocs = [null];
var selectedColors = [];
var manaColors = ['W', 'U', 'B', 'R', 'G'];
var manaNames = { W: 'White', U: 'Blue', B: 'Black', R: 'Red', G: 'Green' };
var manaChars = { W: '\u2600', U: '\u25CF', B: '\u2620', R: '\u25CF', G: '\u25CF' };
var manaColorCss = { W: '#FFFFCC', U: '#0088DD', B: '#AA88CC', R: '#DD3300', G: '#00AA44' };

// Build color filter buttons
(function() {
  var container = document.getElementById('color-filters');
  manaColors.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'color-filter-btn';
    btn.setAttribute('data-color', c);
    btn.title = manaNames[c];
    btn.style.cssText = 'background:#1a0a2e;color:' + manaColorCss[c] + ';border:2px outset #663399;padding:2px 6px;font-size:14px;cursor:pointer;margin:0 2px';
    btn.textContent = manaChars[c];
    btn.addEventListener('click', function() {
      var idx = selectedColors.indexOf(c);
      if (idx >= 0) {
        selectedColors.splice(idx, 1);
        btn.style.borderStyle = 'outset';
        btn.style.background = '#1a0a2e';
      } else {
        selectedColors.push(c);
        btn.style.borderStyle = 'inset';
        btn.style.background = '#330066';
      }
    });
    container.appendChild(btn);
  });
})();

// Populate dropdowns
fetchTagRegistry().then(function(registry) {
  populateDropdown('filter-tag', registry.archetypes);
  populateDropdown('filter-badge', registry.badges);
}).catch(function() {
  var defaults = {
    archetypes: ['aggro','control','combo','midrange','tempo','ramp','tribal','mill','burn','reanimator','prison','toolbox'],
    badges: ['boss-killer','budget','meme','competitive','beginner-friendly','jank','spicy']
  };
  populateDropdown('filter-tag', defaults.archetypes);
  populateDropdown('filter-badge', defaults.badges);
});

function populateDropdown(selectId, items) {
  var select = document.getElementById(selectId);
  items.forEach(function(item) {
    var opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item.replace(/-/g, ' ');
    select.appendChild(opt);
  });
}

function clearEl(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function createFont(text, color, size) {
  var f = document.createElement('font');
  if (color) f.setAttribute('color', color);
  if (size) f.setAttribute('size', String(size));
  f.textContent = text;
  return f;
}

// Build a single deck card cell using DOM methods
function buildDeckCell(deck, isVoted) {
  var td = document.createElement('td');
  td.setAttribute('bgcolor', '#220044');
  td.style.cssText = 'border:2px outset #663399;vertical-align:top;width:50%;padding:12px';

  // Title link
  var titleLink = document.createElement('a');
  titleLink.href = 'deck.html?id=' + encodeURIComponent(deck.id);
  titleLink.style.cssText = 'color:#FFFF00;font-size:15px;font-weight:bold;text-decoration:none';
  titleLink.textContent = deck.title;
  td.appendChild(titleLink);
  td.appendChild(document.createElement('br'));

  // Author
  td.appendChild(createFont('by ' + deck.author, '#00CCFF', 2));
  td.appendChild(document.createElement('br'));

  // Color pips + card count
  var metaSpan = document.createElement('span');
  renderColorPipsDom(deck.colorIdentity, metaSpan);
  metaSpan.appendChild(document.createTextNode(' \u2022 ' + (deck.cardCount || '?') + ' cards'));
  td.appendChild(metaSpan);
  td.appendChild(document.createElement('br'));

  // Tags
  if (deck.tags && deck.tags.length > 0) {
    var tagSpan = document.createElement('span');
    deck.tags.forEach(function(tag) { renderTagDom(tag, tagSpan); });
    td.appendChild(tagSpan);
  }

  // Badges
  if (deck.badges && deck.badges.length > 0) {
    var badgeSpan = document.createElement('span');
    badgeSpan.style.marginLeft = '4px';
    deck.badges.forEach(function(badge) { renderBadgeDom(badge, badgeSpan); });
    td.appendChild(badgeSpan);
  }

  if ((deck.tags && deck.tags.length) || (deck.badges && deck.badges.length)) {
    td.appendChild(document.createElement('br'));
  }

  // Vote button
  td.appendChild(document.createElement('br'));
  var voteBtn = document.createElement('button');
  voteBtn.className = 'vote-btn';
  voteBtn.setAttribute('data-deck-id', deck.id);
  voteBtn.style.cssText = 'background:' + (isVoted ? '#003300' : '#1a0a2e') + ';color:#00FF00;border:2px outset ' + (isVoted ? '#006600' : '#333366') + ';padding:2px 10px;font-size:12px;cursor:pointer';
  voteBtn.textContent = (isVoted ? '\uD83D\uDC4D' : '\u261D') + ' ' + (deck.voteCount || 0);
  td.appendChild(voteBtn);

  // Date
  td.appendChild(createFont(' \u2022 ' + formatDate(deck.createdAt), '#666688', 1));

  return td;
}

// Load decks
async function loadDecks() {
  document.getElementById('loading-indicator').style.display = 'block';
  document.getElementById('no-results').style.display = 'none';
  var grid = document.getElementById('deck-grid');
  clearEl(grid);

  var opts = {
    sortBy: document.getElementById('sort-by').value,
    tag: document.getElementById('filter-tag').value || undefined,
    badge: document.getElementById('filter-badge').value || undefined,
    lastDoc: lastDocs[currentPage - 1] || undefined,
    pageSize: 12
  };

  var colorCode = buildColorCode(selectedColors);
  if (colorCode) opts.colorCode = colorCode;

  try {
    var result = await fetchDecks(opts);

    document.getElementById('loading-indicator').style.display = 'none';

    if (result.decks.length === 0) {
      document.getElementById('no-results').style.display = 'block';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    // Check voted status
    var deckIds = result.decks.map(function(d) { return d.id; });
    var votedSet = new Set();
    try {
      await ensureAuth();
      votedSet = await getVotedDecks(deckIds);
    } catch(e) { /* auth not available */ }

    // Build deck grid table
    var table = document.createElement('table');
    table.setAttribute('width', '100%');
    table.setAttribute('border', '0');
    table.setAttribute('cellpadding', '8');
    table.setAttribute('cellspacing', '6');

    for (var i = 0; i < result.decks.length; i += 2) {
      var row = document.createElement('tr');
      row.appendChild(buildDeckCell(result.decks[i], votedSet.has(result.decks[i].id)));

      if (result.decks[i + 1]) {
        row.appendChild(buildDeckCell(result.decks[i + 1], votedSet.has(result.decks[i + 1].id)));
      } else {
        var emptyTd = document.createElement('td');
        emptyTd.textContent = '\u00A0';
        row.appendChild(emptyTd);
      }

      table.appendChild(row);
    }

    grid.appendChild(table);

    // Pagination
    document.getElementById('pagination').style.display = 'block';
    document.getElementById('btn-prev').style.display = currentPage > 1 ? 'inline' : 'none';
    document.getElementById('btn-next').style.display = result.hasMore ? 'inline' : 'none';
    document.getElementById('page-info').textContent = 'Page ' + currentPage;

    if (result.hasMore) {
      lastDocs[currentPage] = result.lastDoc;
    }

    // Wire vote buttons
    grid.querySelectorAll('.vote-btn').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var deckId = btn.getAttribute('data-deck-id');
        try {
          var res = await toggleVote(deckId);
          btn.textContent = (res.voted ? '\uD83D\uDC4D' : '\u261D') + ' ' + res.newCount;
          btn.style.background = res.voted ? '#003300' : '#1a0a2e';
          btn.style.borderColor = res.voted ? '#006600' : '#333366';
        } catch(e) { /* silently fail */ }
      });
    });

  } catch (e) {
    document.getElementById('loading-indicator').style.display = 'none';
    grid.appendChild(createFont('Error loading decks: ' + e.message, '#FF4444'));
  }
}

// Filter/sort buttons
document.getElementById('btn-apply-filters').addEventListener('click', function() {
  currentPage = 1;
  lastDocs = [null];
  loadDecks();
});

document.getElementById('btn-clear-filters').addEventListener('click', function() {
  selectedColors = [];
  document.querySelectorAll('.color-filter-btn').forEach(function(btn) {
    btn.style.borderStyle = 'outset';
    btn.style.background = '#1a0a2e';
  });
  document.getElementById('filter-tag').value = '';
  document.getElementById('filter-badge').value = '';
  document.getElementById('sort-by').value = 'newest';
  currentPage = 1;
  lastDocs = [null];
  loadDecks();
});

document.getElementById('btn-prev').addEventListener('click', function() {
  if (currentPage > 1) { currentPage--; loadDecks(); }
});

document.getElementById('btn-next').addEventListener('click', function() {
  currentPage++;
  loadDecks();
});

// Initial load
loadDecks();
</script>

<script type="module" src="clippy.js"></script>
<script src="sparkles.js"></script>
</body>
</html>
